# Publishes landing/ to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# The custom domain is set in Settings > Pages; an Actions deploy ignores CNAME files.
name: Landing page

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Node 24 versions. v4 deploy-pages once failed to find the artifact ("No artifacts named
      # github-pages") while running on the forced Node 24 runtime.
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v5
